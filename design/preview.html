<!doctype html>
<html lang="fr"><meta charset="UTF-8"><title>Aperçu local — Académie Delaveau</title>
<p>Ouverture de l’aperçu avec des données fictives…</p>
<script type="module">
// Vite does not include this QA fixture in the production build.
if (!import.meta.env.DEV || !['localhost', '127.0.0.1'].includes(location.hostname)) throw new Error('Aperçu local uniquement');
if (import.meta.env.VITE_SUPABASE_URL) throw new Error('Utiliser un serveur local sans connexion Supabase');
const offset = days => { const d = new Date(); d.setDate(d.getDate() + days); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const names = ['Camille Laurent', 'Hugo Morel', 'Louise Bernard', 'Louis Petit', 'Jade Thomas', 'Gabriel Martin'];
const horses = ['Fidji des Prés', 'Éclipse', 'Orion du Val', '', 'Chanel', ''];
const students = names.map((name, i) => ({id:`preview-${i}`, name, initials:name.split(' ').map(x=>x[0]).join(''), group:[3,5].includes(i)?'Section Espoir':'Section Excellence', horse:horses[i], horseAge:8+i, horseHeight:165+i, horseExperience:'Grand Prix 1,20 m', horsePartnership:'2 ans', birthDate:'2010-04-12', incidents:0}));
const state = { students, observations:[], sanctions:[], absences:[{id:'absence-preview',studentId:students[0].id,date:offset(1),createdAt:new Date().toISOString(),source:'student',requestType:'absence',reason:'Rendez-vous personnel dans la matinée. Retour à l’Académie à 14 h.',text:'Rendez-vous personnel dans la matinée.',targetCoach:'Valentine Delaveau',status:'À vérifier',justification:'Aucun justificatif'}], delays:[{id:'delay-preview',studentId:students[1].id,date:offset(0),createdAt:new Date().toISOString(),source:'student',requestType:'delay',reason:'Retard de transport de 15 minutes.',targetCoach:'Valentine Delaveau',status:'À vérifier',justification:'Aucun justificatif'}], monthlyObservations:[], notifications:[{id:'notification-preview',studentId:students[0].id,requestId:'absence-preview',title:'Nouvelle demande d’absence',text:'Camille Laurent a transmis une demande.',kind:'absence_request',date:offset(0),createdAt:new Date().toISOString(),read:false}], reportCards:[], events:[{id:'event-preview',title:'Concours de Deauville',date:offset(3),location:'Pôle international du Cheval',message:'Rendez-vous aux écuries 30 minutes avant votre horaire à cheval.'}], eventEntries:students.slice(0,3).map((s,i)=>({id:`entry-${i}`,eventId:'event-preview',studentId:s.id,classLabel:i===2?'Club 1':'Prépa 90',bib:String(14+i),ridingTime:`${9+i}:30`})),eventDocuments:[]};
const role = new URLSearchParams(location.search).get('role') || 'admin';
const profiles = { admin:{name:'Admin',initials:'AD'},coach:{name:'Valentine Delaveau',initials:'VD'},student:{name:students[0].name,initials:'CL',studentId:students[0].id},parent:{name:'Alex Laurent',initials:'AL',studentId:students[0].id} };
if (!profiles[role]) throw new Error('Profil inconnu');
if (new URLSearchParams(location.search).has('empty')) Object.keys(state).forEach(key=>state[key]=[]);
localStorage.setItem('delaveau-data-version','2');
localStorage.setItem('delaveau-state',JSON.stringify(state));
localStorage.setItem('delaveau-session',JSON.stringify({...profiles[role],role}));
for (const r of Object.keys(profiles)) localStorage.setItem(`delaveau-tour-${r}`,'done');
location.replace('/');
</script></html>
