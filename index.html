<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#23579a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Académie">
  <title>Académie Delaveau — Suivi</title>
  <link rel="manifest" href="/manifest.webmanifest?v=16">
  <link rel="apple-touch-icon" href="/assets/logo-academie-delaveau.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=15">
  <link rel="stylesheet" href="interface.css?v=2">
  <script type="importmap">{"imports":{"@supabase/supabase-js":"https://esm.sh/@supabase/supabase-js@2"}}</script>
</head>
<body>
  <a class="skip-link" href="#app">Aller au contenu</a>
  <section id="auth-screen" class="auth-screen" aria-live="polite"></section>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Accueil Académie Delaveau">
        <img src="/assets/logo-academie-delaveau.png" alt="Académie Delaveau">
      </a>

      <nav id="main-nav" aria-label="Navigation principale"></nav>

      <div class="sidebar-foot">
        <button class="sidebar-help" id="help-button" type="button"><span data-ui-icon="help"></span> Guide de l’application</button>
        <button class="profile-card" id="profile-button" type="button">
          <span class="avatar" id="profile-avatar">CM</span>
          <span><strong id="profile-name"></strong><small id="profile-role"></small></span>
          <span aria-hidden="true">⌄</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-button" id="menu-button" aria-label="Ouvrir le menu">☰</button>
        <img class="mobile-logo" src="/assets/logo-academie-delaveau.png" alt="Académie Delaveau">
        <div class="topbar-context"><span>Mon espace</span><span aria-hidden="true">/</span><strong id="current-page-label">Vue d’ensemble</strong></div>
        <div class="top-actions">
          <label class="search"><span data-ui-icon="search"></span><input id="global-search" type="search" placeholder="Rechercher un élève…" aria-label="Rechercher un élève"></label>
          <button class="icon-button" id="notifications-button" aria-label="Notifications"><span data-ui-icon="bell"></span><span class="notification-dot" hidden></span></button>
          <button class="topbar-profile" id="role-switch-button" aria-label="Ouvrir mon compte"><span class="avatar" id="topbar-avatar"></span><span class="desktop-label">Mon compte</span></button>
        </div>
      </header>
      <div id="app" class="page" tabindex="-1" aria-live="polite"></div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Fermer">×</button>
      <div id="modal-content"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="tour-layer" class="tour-layer hidden" aria-live="polite">
    <div id="tour-focus" class="tour-focus"></div>
    <aside id="tour-card" class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title">
      <span class="tour-count" id="tour-count"></span>
      <h2 id="tour-title"></h2>
      <p id="tour-text"></p>
      <div class="tour-actions"><button class="ghost-button" id="tour-skip">Passer</button><button class="primary-button" id="tour-next">Suivant</button></div>
    </aside>
  </div>
  <script type="module" src="app.js?v=26"></script>
</body>
</html>
